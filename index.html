<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Notes</title>
  <link rel="icon" type="image/png" href="logo.png">
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
      background: #f8f9fb;
    }
    h1, h2 { text-align: center; }
    input, textarea {
      width: 100%;
      font-size: 16px;
      margin: 10px 0;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      box-sizing: border-box;
    }
    textarea { height: 150px; resize: none; }
    button {
      margin: 5px;
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
      transition: 0.2s;
    }
    button:hover { opacity: 0.9; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    #saveBtn, #loginBtn, #createBtn { background: #4caf50; color: white; }
    #newBtn, #showSignupBtn { background: #2196f3; color: white; }
    #deleteBtn, #confirmDeleteAccountBtn { background: #f44336; color: white; }
    #logoutBtn { background: #607d8b; color: white; margin: 0; padding: 6px 14px; font-size: 14px; }
    #deleteAccountBtn { background: transparent; color: #f44336; border: 1px solid #f44336; margin: 0; padding: 6px 14px; font-size: 14px; }
    #cancelDeleteAccountBtn, #backToLoginBtn, #backToLoginBtn2, #cancelResetBtn { background: #e0e0e0; color: #333; }
    #sendResetBtn, #updatePwBtn { background: #4caf50; color: white; }
    .link-btn {
      background: none;
      border: none;
      color: #2196f3;
      font-size: 14px;
      padding: 4px;
      margin: 0;
      text-decoration: underline;
    }
    .center { text-align: center; }
    .note-item {
      background: white;
      border: 1px solid #ddd;
      margin: 5px 0;
      padding: 10px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    #status {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #4caf50;
      color: white;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: bold;
      opacity: 0;
      transition: opacity 0.5s ease;
      pointer-events: none;
    }
    #status.error { background: #f44336; }

    /* Auth screen */
    #authView {
      max-width: 380px;
      margin: 0 auto;
      background: white;
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 20px 24px;
    }
    .auth-msg { text-align: center; font-size: 14px; min-height: 20px; color: #f44336; }
    .auth-msg.ok { color: #2e7d32; }
    .auth-buttons { text-align: center; }
    .hidden { display: none; }
    #topBar {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      color: #555;
      flex-wrap: wrap;
    }
    #deleteAccountPanel {
      background: #fff5f5;
      border: 1px solid #f44336;
      border-radius: 10px;
      padding: 12px 16px;
      margin: 10px 0;
      font-size: 14px;
    }
    #deleteAccountPanel p { margin: 4px 0 0; }
  </style>
</head>
<body>
  <h1>📝 My Notes</h1>

  <!-- ============ LOGIN / SIGN UP ============ -->
  <div id="authView" class="hidden">

    <!-- Login panel (default) -->
    <div id="loginPanel">
      <h2 style="margin-top:0">Welcome</h2>
      <input type="text" id="loginId" placeholder="Username or email" autocomplete="username">
      <input type="password" id="loginPassword" placeholder="Password" autocomplete="current-password">
      <div id="loginMsg" class="auth-msg"></div>
      <div class="auth-buttons">
        <button id="loginBtn">Log in</button>
        <button id="showSignupBtn">Sign up</button>
      </div>
      <div class="center">
        <button id="forgotLinkBtn" class="link-btn">Forgot password?</button>
      </div>
    </div>

    <!-- Sign-up panel -->
    <div id="signupPanel" class="hidden">
      <h2 style="margin-top:0">Create account</h2>
      <input type="text" id="suUsername" placeholder="Username (3-20 letters, numbers, _)" autocomplete="off" maxlength="20">
      <input type="email" id="suEmail" placeholder="Email" autocomplete="email">
      <input type="password" id="suPassword" placeholder="Password (min 6 characters)" autocomplete="new-password">
      <input type="password" id="suConfirm" placeholder="Confirm password" autocomplete="new-password">
      <div id="signupMsg" class="auth-msg"></div>
      <div class="auth-buttons">
        <button id="createBtn">Create account</button>
        <button id="backToLoginBtn">Back to login</button>
      </div>
    </div>

    <!-- Forgot password panel -->
    <div id="forgotPanel" class="hidden">
      <h2 style="margin-top:0">Reset password</h2>
      <p style="font-size:14px;color:#555;text-align:center;margin:0">Enter your username or email and we'll send you a reset link.</p>
      <input type="text" id="fpId" placeholder="Username or email" autocomplete="username">
      <div id="forgotMsg" class="auth-msg"></div>
      <div class="auth-buttons">
        <button id="sendResetBtn">Send reset link</button>
        <button id="backToLoginBtn2">Back to login</button>
      </div>
    </div>

    <!-- Set new password panel (shown after clicking the email link) -->
    <div id="resetPanel" class="hidden">
      <h2 style="margin-top:0">Set new password</h2>
      <input type="password" id="newPassword" placeholder="New password (min 6 characters)" autocomplete="new-password">
      <input type="password" id="newConfirm" placeholder="Confirm new password" autocomplete="new-password">
      <div id="resetMsg" class="auth-msg"></div>
      <div class="auth-buttons">
        <button id="updatePwBtn">Update password</button>
        <button id="cancelResetBtn">Cancel</button>
      </div>
    </div>
  </div>

  <!-- ============ NOTES APP ============ -->
  <div id="appView" class="hidden">
    <div id="topBar">
      <span>Signed in as <strong id="userName"></strong></span>
      <button id="logoutBtn">Log out</button>
      <button id="deleteAccountBtn">Delete account</button>
    </div>

    <div id="deleteAccountPanel" class="hidden">
      <strong>Delete your account?</strong>
      <p>This permanently deletes your account and all of your notes. It cannot be undone.</p>
      <input type="text" id="deleteConfirmInput" placeholder='Type DELETE to confirm' autocomplete="off">
      <div style="text-align:center;">
        <button id="confirmDeleteAccountBtn">Delete my account</button>
        <button id="cancelDeleteAccountBtn">Cancel</button>
      </div>
    </div>

    <input type="text" id="title" placeholder="Note title...">
    <textarea id="content" placeholder="Write your note here..."></textarea>

    <div style="text-align:center;">
      <button id="saveBtn">💾 Save</button>
      <button id="newBtn">➕ New</button>
      <button id="deleteBtn">🗑️ Delete</button>
    </div>

    <h2>Saved Notes</h2>
    <div id="notesList"></div>
  </div>

  <div id="status">Saved!</div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script>
    // =============================
    // Supabase Settings
    // Paste your own values from: Supabase dashboard > Project Settings > API
    // The "anon public" key is SAFE to put here (protected by Row Level Security).
    // NEVER put the "service_role" key in this file.
    // =============================
    const SUPABASE_URL = "https://weboyfebxrffcormlpia.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_Un6_QJn7_cgfHj-hJYpziQ_aYacXogh";

    // Read email-link info from the URL before Supabase clears it
    const linkHash = window.location.hash;
    let recovering = linkHash.includes('type=recovery');   // opened a password-reset link
    let expiredNotice = linkHash.includes('error_code=otp_expired'); // opened an expired link

    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let notes = [];
    let currentId = null;
    let typingTimeout;
    let saving = false;
    let saveQueued = false;
    let loadedForUser = null;

    const $ = id => document.getElementById(id);
    const titleInput = $('title');
    const contentInput = $('content');
    const statusEl = $('status');

    // =============================
    // Helpers
    // =============================
    function showStatus(msg = "Saved!", isError = false) {
      statusEl.textContent = msg;
      statusEl.classList.toggle('error', isError);
      statusEl.style.opacity = 1;
      setTimeout(() => statusEl.style.opacity = 0, 1800);
    }

    function setMsg(el, msg, ok = false) {
      el.textContent = msg;
      el.classList.toggle('ok', ok);
    }

    function showPanel(name) {
      ['login', 'signup', 'forgot', 'reset'].forEach(p => {
        $(p + 'Panel').classList.toggle('hidden', p !== name);
      });
      ['loginMsg', 'signupMsg', 'forgotMsg', 'resetMsg'].forEach(id => setMsg($(id), ''));
    }
    const showLoginPanel = () => showPanel('login');
    const showSignupPanel = () => showPanel('signup');
    const showForgotPanel = () => {
      $('fpId').value = $('loginId').value;
      showPanel('forgot');
    };

    function showAuth() {
      $('authView').classList.remove('hidden');
      $('appView').classList.add('hidden');
    }

    function showApp() {
      $('authView').classList.add('hidden');
      $('appView').classList.remove('hidden');
    }

    const USERNAME_RE = /^[A-Za-z0-9_]{3,20}$/;

    // =============================
    // Auth: login (username OR email)
    // =============================
    async function login() {
      const id = $('loginId').value.trim();
      const password = $('loginPassword').value;
      const msg = $('loginMsg');
      if (!id || !password) return setMsg(msg, "Enter your username/email and password.");
      setMsg(msg, "");
      $('loginBtn').disabled = true;

      try {
        let email = id;
        if (!id.includes('@')) {
          // Treat it as a username: look up the matching email
          const { data, error } = await sb.rpc('get_login_email', { identifier: id });
          if (error || !data) {
            setMsg(msg, "Invalid username/email or password.");
            return;
          }
          email = data;
        }
        const { error } = await sb.auth.signInWithPassword({ email, password });
        if (error) {
          setMsg(msg, error.message === "Invalid login credentials"
            ? "Invalid username/email or password."
            : error.message);
        }
      } finally {
        $('loginBtn').disabled = false;
      }
    }

    // =============================
    // Auth: sign up
    // =============================
    async function signup() {
      const username = $('suUsername').value.trim();
      const email = $('suEmail').value.trim();
      const password = $('suPassword').value;
      const confirm = $('suConfirm').value;
      const msg = $('signupMsg');

      if (!username || !email || !password || !confirm) return setMsg(msg, "Please fill in all fields.");
      if (!USERNAME_RE.test(username)) return setMsg(msg, "Username must be 3-20 characters: letters, numbers or _ only.");
      if (password.length < 6) return setMsg(msg, "Password must be at least 6 characters.");
      if (password !== confirm) return setMsg(msg, "Passwords do not match.");

      setMsg(msg, "");
      $('createBtn').disabled = true;

      try {
        const { data: available, error: checkErr } = await sb.rpc('username_available', { name: username });
        if (checkErr) return setMsg(msg, "Could not check username. Try again.");
        if (!available) return setMsg(msg, "That username is already taken.");

        const { data, error } = await sb.auth.signUp({
          email,
          password,
          options: {
            data: { username },
            // Send the confirmation link back to this exact page
            emailRedirectTo: window.location.origin + window.location.pathname
          }
        });
        if (error) return setMsg(msg, error.message);

        if (!data.session) {
          setMsg(msg, "Account created! Check your email to confirm, then log in.", true);
          $('suPassword').value = '';
          $('suConfirm').value = '';
        }
      } finally {
        $('createBtn').disabled = false;
      }
    }

    // =============================
    // Auth: forgot password
    // =============================
    async function sendReset() {
      const id = $('fpId').value.trim();
      const msg = $('forgotMsg');
      if (!id) return setMsg(msg, "Enter your username or email.");
      setMsg(msg, "");
      $('sendResetBtn').disabled = true;

      try {
        let email = id;
        if (!id.includes('@')) {
          const { data } = await sb.rpc('get_login_email', { identifier: id });
          email = data || null;
        }
        if (email) {
          const { error } = await sb.auth.resetPasswordForEmail(email, {
            // The link in the email brings the user back to this page
            redirectTo: window.location.origin + window.location.pathname
          });
          if (error && (error.status === 429 || /rate limit/i.test(error.message))) {
            return setMsg(msg, "Too many requests. Please wait a few minutes and try again.");
          }
        }
        // Same message whether or not the account exists (doesn't reveal who has an account)
        setMsg(msg, "If an account exists, a reset link has been sent. Check your email (and spam folder).", true);
      } finally {
        $('sendResetBtn').disabled = false;
      }
    }

    async function updatePassword() {
      const pw = $('newPassword').value;
      const cf = $('newConfirm').value;
      const msg = $('resetMsg');
      if (!pw || !cf) return setMsg(msg, "Please fill in both fields.");
      if (pw.length < 6) return setMsg(msg, "Password must be at least 6 characters.");
      if (pw !== cf) return setMsg(msg, "Passwords do not match.");

      setMsg(msg, "");
      $('updatePwBtn').disabled = true;
      try {
        const { data, error } = await sb.auth.updateUser({ password: pw });
        if (error) return setMsg(msg, error.message);

        recovering = false;
        $('newPassword').value = '';
        $('newConfirm').value = '';
        history.replaceState(null, '', window.location.pathname + window.location.search);

        // Go straight into the app, already logged in
        const user = data.user;
        showApp();
        loadedForUser = user.id;
        loadProfile(user);
        loadNotes();
        showStatus("Password updated!");
      } finally {
        $('updatePwBtn').disabled = false;
      }
    }

    async function cancelReset() {
      recovering = false;
      history.replaceState(null, '', window.location.pathname + window.location.search);
      await sb.auth.signOut();
    }

    async function logout() {
      clearTimeout(typingTimeout);
      await sb.auth.signOut();
    }

    // =============================
    // Auth: delete account
    // =============================
    function openDeletePanel() {
      $('deleteConfirmInput').value = '';
      $('deleteAccountPanel').classList.remove('hidden');
      $('deleteConfirmInput').focus();
    }

    function closeDeletePanel() {
      $('deleteAccountPanel').classList.add('hidden');
      $('deleteConfirmInput').value = '';
    }

    async function deleteAccount() {
      if ($('deleteConfirmInput').value.trim() !== 'DELETE') {
        return showStatus('Type DELETE to confirm', true);
      }
      clearTimeout(typingTimeout);
      $('confirmDeleteAccountBtn').disabled = true;
      const { error } = await sb.rpc('delete_my_account');
      $('confirmDeleteAccountBtn').disabled = false;
      if (error) {
        console.error("Failed to delete account:", error);
        return showStatus("Could not delete account", true);
      }
      closeDeletePanel();
      await sb.auth.signOut();
      showStatus("Account deleted");
    }

    // =============================
    // Auth state (runs on page load and on login/logout)
    // =============================
    sb.auth.onAuthStateChange((event, session) => {
      if (event === 'PASSWORD_RECOVERY') recovering = true;

      // Came from a reset link: ask for a new password instead of opening the app
      if (recovering && session && session.user) {
        showAuth();
        showPanel('reset');
        return;
      }

      if (session && session.user) {
        showApp();
        if (loadedForUser !== session.user.id) {
          loadedForUser = session.user.id;
          // setTimeout avoids calling Supabase inside its own auth callback
          setTimeout(() => { loadProfile(session.user); loadNotes(); }, 0);
        }
      } else {
        loadedForUser = null;
        notes = [];
        currentId = null;
        titleInput.value = '';
        contentInput.value = '';
        $('notesList').innerHTML = '';
        $('userName').textContent = '';
        $('loginPassword').value = '';
        closeDeletePanel();
        showLoginPanel();
        showAuth();
        if (expiredNotice) {
          expiredNotice = false;
          setMsg($('loginMsg'), "That email link has expired or was already used. Use 'Forgot password?' to get a new one.");
        }
      }
    });

    async function loadProfile(user) {
      const { data } = await sb.from('profiles').select('username').eq('id', user.id).maybeSingle();
      $('userName').textContent = (data && data.username) || 'User';
    }

    // =============================
    // Notes (each user only sees their own, enforced by the database)
    // =============================
    async function loadNotes() {
      const { data, error } = await sb
        .from('notes')
        .select('id, title, content')
        .order('updated_at', { ascending: false });

      if (error) {
        console.error("Failed to load notes:", error);
        showStatus("Failed to load notes", true);
        return;
      }
      notes = data || [];
      renderNotes();
    }

    function renderNotes() {
      const list = $('notesList');
      list.innerHTML = '';
      notes.forEach(n => {
        const div = document.createElement('div');
        div.className = 'note-item';

        const strong = document.createElement('strong');
        strong.textContent = n.title || "(No title)"; // textContent prevents HTML injection

        const btn = document.createElement('button');
        btn.textContent = 'View';
        btn.addEventListener('click', () => loadNote(n.id));

        div.append(strong, btn);
        list.appendChild(div);
      });
    }

    function loadNote(id) {
      const n = notes.find(x => x.id === id);
      if (!n) return;
      clearTimeout(typingTimeout);
      currentId = id;
      titleInput.value = n.title;
      contentInput.value = n.content;
      showStatus("Note loaded!");
    }

    function newNote() {
      clearTimeout(typingTimeout);
      currentId = null;
      titleInput.value = '';
      contentInput.value = '';
      showStatus("New note ready!");
    }

    async function saveNote() {
      clearTimeout(typingTimeout);
      const title = titleInput.value.trim();
      const content = contentInput.value.trim();
      if (!title && !content) return;

      // Avoid two saves running at once (would create duplicate notes)
      if (saving) { saveQueued = true; return; }
      saving = true;

      try {
        if (currentId === null) {
          const { data, error } = await sb
            .from('notes')
            .insert({ title, content })
            .select('id, title, content')
            .single();
          if (error) throw error;
          notes.unshift(data);
          currentId = data.id;
        } else {
          const { error } = await sb
            .from('notes')
            .update({ title, content, updated_at: new Date().toISOString() })
            .eq('id', currentId);
          if (error) throw error;
          const i = notes.findIndex(n => n.id === currentId);
          if (i !== -1) notes[i] = { id: currentId, title, content };
        }
        renderNotes();
        showStatus();
      } catch (err) {
        console.error("Failed to save note:", err);
        showStatus("Save failed", true);
      } finally {
        saving = false;
        if (saveQueued) { saveQueued = false; saveNote(); }
      }
    }

    async function deleteNote() {
      if (currentId === null) return showStatus("No note selected!");
      if (!confirm("Delete this note?")) return;

      clearTimeout(typingTimeout);
      const { error } = await sb.from('notes').delete().eq('id', currentId);
      if (error) {
        console.error("Failed to delete note:", error);
        return showStatus("Delete failed", true);
      }
      notes = notes.filter(n => n.id !== currentId);
      currentId = null;
      titleInput.value = '';
      contentInput.value = '';
      renderNotes();
      showStatus("Note deleted!");
    }

    // Auto-save after 2 seconds of inactivity
    [titleInput, contentInput].forEach(input => {
      input.addEventListener('input', () => {
        clearTimeout(typingTimeout);
        typingTimeout = setTimeout(saveNote, 2000);
      });
    });

    // =============================
    // Wire up buttons
    // =============================
    $('loginBtn').addEventListener('click', login);
    $('showSignupBtn').addEventListener('click', showSignupPanel);
    $('createBtn').addEventListener('click', signup);
    $('backToLoginBtn').addEventListener('click', showLoginPanel);
    $('backToLoginBtn2').addEventListener('click', showLoginPanel);
    $('forgotLinkBtn').addEventListener('click', showForgotPanel);
    $('sendResetBtn').addEventListener('click', sendReset);
    $('updatePwBtn').addEventListener('click', updatePassword);
    $('cancelResetBtn').addEventListener('click', cancelReset);
    $('fpId').addEventListener('keydown', e => { if (e.key === 'Enter') sendReset(); });
    $('newConfirm').addEventListener('keydown', e => { if (e.key === 'Enter') updatePassword(); });
    $('logoutBtn').addEventListener('click', logout);
    $('deleteAccountBtn').addEventListener('click', openDeletePanel);
    $('cancelDeleteAccountBtn').addEventListener('click', closeDeletePanel);
    $('confirmDeleteAccountBtn').addEventListener('click', deleteAccount);
    $('saveBtn').addEventListener('click', saveNote);
    $('newBtn').addEventListener('click', newNote);
    $('deleteBtn').addEventListener('click', deleteNote);
    $('loginPassword').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
    $('suConfirm').addEventListener('keydown', e => { if (e.key === 'Enter') signup(); });
  </script>
</body>
</html>
